name: Local workflow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: chaichai-studio
      - uses: actions/checkout@v4
        with:
          repository: hubooooooo/chaichai
          ref: 74ec6d01074c7df4a0e635bb59b8fe50e5a27607
          path: chaichai-main
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - run: npm ci && npm run build:cached
        working-directory: chaichai-main
        env:
          HUSKY: "0"
      - run: npm ci && npm run check && npm test
        working-directory: chaichai-studio
