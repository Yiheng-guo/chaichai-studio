name: Local workflow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: chaichai-studio
      - uses: actions/checkout@v4
        with:
          repository: Yiheng-guo/chaichai
          ref: e887f9e1a1993ba9a9c889aa63bc8e898dff1062
          path: chaichai-engine
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - run: npm ci && npm run build:cached
        working-directory: chaichai-engine
        env:
          HUSKY: "0"
      - run: npm ci && npm run doctor && npm run check && npm test
        working-directory: chaichai-studio
